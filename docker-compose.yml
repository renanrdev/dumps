# docker-compose.yml — Local development environment for dumps.sh.
#
# This provides MinIO (S3-compatible, acts as R2 stand-in) and Redis
# for local integration testing WITHOUT using Cloudflare services.
#
# NOTE: For Cloudflare Workers dev with real bindings, use `wrangler dev`
# instead. Wrangler dev uses its own local R2/KV simulation automatically.
# Use this compose file only if you're running the service outside of Workers
# (e.g., a future Go/Node server targeting the same ports & adapters).
#
# Usage:
#   docker compose up -d
#   # MinIO console: http://localhost:9001  (admin / minioadmin)
#   # Redis:         localhost:6379

version: "3.9"

services:
  # -------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (stand-in for Cloudflare R2 locally)
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: dumps-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # MinIO bucket initialiser — creates the paste bucket on startup.
  # -------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: dumps-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/dumps-paste-blobs &&
        mc ilm import local/dumps-paste-blobs <<EOF
      {\"Rules\":[{\"ID\":\"expire-30d\",\"Status\":\"Enabled\",\"Expiration\":{\"Days\":30}}]}
      EOF
        echo 'MinIO bucket ready.'
      "

  # -------------------------------------------------------------------------
  # Redis — metadata, TTL, rate limiting counters (stand-in for KV + DO)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dumps-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  minio_data:
  redis_data:
